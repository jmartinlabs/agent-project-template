name: template-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: template-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Runs only in the template repository; projects created from it skip this job.
  required:
    if: github.repository == 'jmartinlabs/agent-project-template'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Check scaffold file set and limits
        id: scaffold
        run: |
          python3 -I - <<'PY'
          import json, os, re, subprocess, sys
          errors = []
          files = [
              "AGENTS.md", "CLAUDE.md", "README.md", ".gitignore",
              ".claude/settings.json", ".agents/harnesses/claude.json",
              "specs/project.md", "specs/project-rules.md",
              "specs/guidelines/architecture.md", "specs/guidelines/quality.md",
              "specs/guidelines/security.md", "specs/guidelines/ui.md",
          ]
          for f in files:
              if not os.path.isfile(f):
                  errors.append(f"missing file: {f}")
          if os.path.isfile("AGENTS.md"):
              n = len(open("AGENTS.md", encoding="utf-8").read().splitlines())
              if n > 25:
                  errors.append(f"AGENTS.md has {n} lines (max 25)")
          if os.path.isfile("CLAUDE.md") and "@AGENTS.md" not in open("CLAUDE.md", encoding="utf-8").read():
              errors.append("CLAUDE.md does not contain @AGENTS.md")
          tag = ""
          try:
              s = json.load(open(".claude/settings.json", encoding="utf-8"))
              ask = s.get("permissions", {}).get("ask", [])
              if not isinstance(ask, list) or len(ask) != 12:
                  errors.append(f"settings.json needs 12 ask rules, found {len(ask) if isinstance(ask, list) else ask!r}")
              if s.get("enabledPlugins", {}).get("agentic@agentic-harness") is not True:
                  errors.append("enabledPlugins lacks agentic@agentic-harness")
              source = s.get("extraKnownMarketplaces", {}).get("agentic-harness", {}).get("source", {})
              if source.get("source") != "github" or source.get("repo") != "jmartinlabs/agentic-harness-plugin":
                  errors.append("marketplace source must be github jmartinlabs/agentic-harness-plugin")
              tag = source.get("ref", "")
              if not isinstance(tag, str) or not re.fullmatch(r"v\d+\.\d+\.\d+", tag):
                  errors.append(f"marketplace ref is not a vX.Y.Z tag: {tag!r}")
                  tag = ""
          except Exception as e:
              errors.append(f"settings.json invalid: {e}")
          try:
              if json.load(open(".agents/harnesses/claude.json", encoding="utf-8")) != {"version": 2}:
                  errors.append('.agents/harnesses/claude.json must be {"version": 2}')
          except Exception as e:
              errors.append(f"claude.json invalid: {e}")
          for p in [".agents/skills", ".agents/roles", ".claude/skills", ".claude/agents",
                    ".opencode", ".codex", "specs/methodology", "templates", "scripts"]:
              if os.path.exists(p):
                  errors.append(f"plugin-owned path present: {p}")
          tracked = subprocess.run(["git", "ls-files"], capture_output=True, text=True, check=True).stdout.split("\n")
          pat = re.compile(r"(/Users/[A-Za-z0-9._-]+|/home/[A-Za-z0-9._-]+|[A-Za-z]:\\Users\\|[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,})")
          for f in tracked:
              if not f or f.startswith(".github/") or f == "LICENSE" or not os.path.isfile(f):
                  continue
              try:
                  text = open(f, encoding="utf-8").read()
              except UnicodeDecodeError:
                  continue
              for m in pat.finditer(text):
                  errors.append(f"{f}: local path or e-mail address: {m.group(0)}")
          if errors:
              print("\n".join("FAIL: " + e for e in errors))
              sys.exit(1)
          with open(os.environ.get("GITHUB_OUTPUT", os.devnull), "a") as out:
              out.write(f"tag={tag}\n")
          print("scaffold checks passed; pinned tag", tag)
          PY
      - name: Check out the plugin at the pinned tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: jmartinlabs/agentic-harness-plugin
          ref: ${{ steps.scaffold.outputs.tag }}
          path: plugin
          persist-credentials: false
      - name: Validate the project against the plugin
        run: |
          python3 plugin/scripts/validate-core --project .
          python3 plugin/scripts/verify-project.py --project . --coordinator claude
